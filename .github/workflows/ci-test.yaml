name: Tests

on:
  pull_request:
    branches: [throwaway-test-predictor]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: predictor-fixture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fixture:
    name: spread fixture
    if: >-
      github.repository == 'Rnfudge02/snapd' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'predictor-fixture/') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate fixture artifacts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p fixture/pr fixture/results
          printf '%s\n' "$PR_NUMBER" > fixture/pr/pr_number
          jq -n '{items: [{name: "tests/main/predictor-fixture", backend: "google", system: "ubuntu-24.04-64", scenario: "generic", verb: "executing", success: false}]}' > fixture/results/results.json

      - name: Upload PR number
        uses: actions/upload-artifact@v7
        with:
          name: pr_number
          path: fixture/pr/pr_number
          overwrite: true
          retention-days: 1

      - name: Upload spread result
        uses: actions/upload-artifact@v7
        with:
          name: spread-results-${{ github.run_id }}-${{ github.run_attempt }}-fixture
          path: fixture/results/results.json
          retention-days: 1

      - name: Deliberate fixture failure
        run: |
          printf '%s Failed tasks: 1\n' "$(date -u '+%Y-%m-%d %H:%M:%S')"
          exit 1